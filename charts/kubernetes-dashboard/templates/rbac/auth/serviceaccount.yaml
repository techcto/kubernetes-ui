{{- if and (eq .Values.app.mode "dashboard") .Values.auth.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-%s" (include "kubernetes-dashboard.fullname" .) .Values.auth.role) .Values.auth.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.auth.role }}
  {{- with .Values.auth.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
