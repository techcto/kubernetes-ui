services:
  auth:
    container_name: dashboard-auth
    build:
      context: ../../modules
      dockerfile: auth/Dockerfile
      args:
        VERSION: ${VERSION:?}
    command:
      - "--kubeconfig=${KUBECONFIG:?}"
    volumes:
      - ${KUBECONFIG:?}:${KUBECONFIG:?} # Required - tmp kubeconfig path resolves to $DASHBOARD_DIR/.tmp/kubeconfig
    tmpfs:
      - /tmp

  api:
    container_name: dashboard-api
    build:
      context: ../../modules
      dockerfile: api/Dockerfile
      args:
        VERSION: ${VERSION:?}
    command:
      --kubeconfig=${KUBECONFIG:?}
      --sidecar-host=${SIDECAR_HOST:?}
    volumes:
      - ${KUBECONFIG:?}:${KUBECONFIG:?} # Required - tmp kubeconfig path resolves to $DASHBOARD_DIR/.tmp/kubeconfig
    tmpfs:
      - /tmp

  web:
    container_name: dashboard-web
    build:
      context: ../..
      dockerfile: modules/web/Dockerfile
      args:
        VERSION: ${VERSION:?}
        WEB_BUILDER_ARCH: ${WEB_BUILDER_ARCH:?}
    command:
      - "--kubeconfig=${KUBECONFIG:?}"
      - "--system-banner=${SYSTEM_BANNER:?}"
      - "--system-banner-severity=${SYSTEM_BANNER_SEVERITY:?}"
    environment:
      - KUBERNETES_DASHBOARD_AUTH_URL=http://auth:8000
      - KUBERNETES_DASHBOARD_API_URL=http://api:8000
    ports:
      - "8080:8000"
    volumes:
      - ${KUBECONFIG:?}:${KUBECONFIG:?} # Required - tmp kubeconfig path resolves to $DASHBOARD_DIR/.tmp/kubeconfig
    tmpfs:
      - /tmp

  scraper:
    container_name: metrics-scraper
    build:
      context: ../../modules
      dockerfile: metrics-scraper/Dockerfile
      args:
        VERSION: ${VERSION:?}
    command:
      --kubeconfig=${KUBECONFIG:?}
      --metric-resolution=5s
      --metric-duration=10m
    volumes:
      - ${KUBECONFIG:?}:${KUBECONFIG:?} # Required - tmp kubeconfig path resolves to $DASHBOARD_DIR/.tmp/kubeconfig
    shm_size: 1G
    tmpfs:
      - /tmp

networks:
  default:
    name: kind
    external: true
